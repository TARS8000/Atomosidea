services:
  mon-nginx:
    # 版を固定する（nginx:alpine のままだと古いイメージが残っていても pull されない）。
    # 1.31.9 は NGINX2Root（CVE-2026-123007 ほか 4 件）の修正版
    image: nginx:1.31.9-alpine
    container_name: mon-nginx
    restart: always
    ports:
      # 運用ダッシュボード（MinIO の操作が可能）のため、Basic 認証に加えてホストのループバックのみに公開する
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html:ro # mon-frontendによって生成されるホストのdistディレクトリをマウント
    depends_on:
      - mon-backend
      - mon-frontend # 起動順を mon-frontend の後にするだけ（ビルド完了は待たない。完了前は dist が空または前回のビルド）
    networks:
      - monitoring-network

  # mon-backend に Docker ソケットを直接渡さないためのプロキシ（読み取り専用）。
  # docker.sock の :ro はソケットのファイルが読み取り専用になるだけで、API は全部使える（コンテナの作成・exec など。
  # mon-backend を乗っ取られるとホストの root を取られる）ので、mon-backend が使う読み取りの API
  # （/_ping、/containers の一覧・inspect・stats・logs、/volumes の一覧）だけを通す。
  # POST=0 なので GET/HEAD 以外（コンテナの作成・exec・restart・stop・削除など）はすべて 403。ここに届くのは mon-backend だけ（mon-docker-net）。
  # 残る読み取り：/containers の GET はすべて通る（inspect の環境変数＝DB や MinIO の資格情報。mon-backend は MinIO の資格情報を
  # ここから読むので、もともと必要）・ログ・archive / export でのファイルの読み取りなど）。
  # GET の /containers/{id}/attach/ws（WebSocket）も通るので、stdin_open のコンテナがあればその標準入力には書き込める（今は無い）
  mon-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0 # ルートの docker-compose.yml の sfsp-docker-proxy と同じ版
    container_name: mon-docker-proxy
    restart: always
    # ログの追従（/ws/logs）が、ログの出ないコンテナで HAProxy の既定のタイムアウト（10 分）で切れないよう 24 時間に延ばしてから
    # 元の entrypoint を実行する
    entrypoint:
      - sh
      - -c
      - sed -i -e 's/timeout client 10m/timeout client 24h/' -e 's/timeout server 10m/timeout server 24h/' /usr/local/etc/haproxy/haproxy.cfg.template && exec docker-entrypoint.sh haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    environment:
      CONTAINERS: 1 # ContainerList / ContainerInspect / ContainerStats / ContainerLogs（GET だけ）
      VOLUMES: 1 # VolumeList
      POST: 0 # GET/HEAD だけを通す（書き込みの API は mon-backend に無い）
      PING: 1 # API バージョンのネゴシエーション
      VERSION: 0
      EVENTS: 0
      INFO: 0
      IMAGES: 0
      EXEC: 0
      NETWORKS: 0
      BUILD: 0
      COMMIT: 0
      SYSTEM: 0
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SWARM: 0
      DISTRIBUTION: 0
      SESSION: 0
      GRPC: 0
      ALLOW_RESTARTS: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - mon-docker-net # mon-backend

  mon-backend:
    build:
      context: ./backend
    container_name: mon-backend
    restart: always
    # ログイン（HTTP Basic）。値はプロジェクトルートの .env（scripts/start.bat が --env-file で渡す）。
    # 未設定だと mon-backend は全リクエストを拒否する（fail closed）
    environment:
      MONITOR_USERNAME: ${MONITOR_USERNAME:-}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-}
      # 許可ホストの追加（カンマ区切り、任意）。localhost / 127.0.0.1 / ::1 は常に許可。空・未設定なら追加なし
      MONITORING_ALLOWED_HOSTS: ${MONITORING_ALLOWED_HOSTS:-}
      # DoS 対策の見張り（backend/guard.go）。処理待ちの件数を Redis から読む
      REDIS_ADDR: atmosidea-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # しきい値を超えたら Discord に知らせる（未設定ならダッシュボードに出すだけ）
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_MIN_FREE_DISK_BYTES: ${ALERT_MIN_FREE_DISK_BYTES:-16106127360}
      ALERT_SCAN_BACKLOG: ${ALERT_SCAN_BACKLOG:-15}
      ALERT_TRANSCODE_BACKLOG: ${ALERT_TRANSCODE_BACKLOG:-8}
      ALERT_429_PER_5MIN: ${ALERT_429_PER_5MIN:-300}
      ALERT_5XX_PER_5MIN: ${ALERT_5XX_PER_5MIN:-50}
      ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-30}
      # 監視対象の compose プロジェクト（Atomosidea 本体）。表示・ログ・MinIO 操作をこのプロジェクトのコンテナに限る。
      # 未設定なら mon-backend が atmosidea-frontend コンテナのプロジェクトを使う
      MONITOR_PROJECT: ${COMPOSE_PROJECT_NAME:-}
      # Docker API は mon-docker-proxy（読み取りだけ）経由。docker.sock は直接マウントしない
      DOCKER_HOST: tcp://mon-docker-proxy:2375
    depends_on:
      - mon-docker-proxy
    networks:
      - monitoring-network
      - mon-docker-net # mon-docker-proxy（Docker API。読み取りだけ）
      - atmosidea-network # 既存のネットワークに接続（MinIO の操作で atmosidea-minio:9000 に到達するため）

  mon-frontend:
    build:
      context: ./frontend
    container_name: mon-frontend-builder
    volumes:
      - ./frontend:/app # ホストのfrontendディレクトリをコンテナの/appにマウント（ビルド成果物は /app/dist = ホストの frontend/dist に出力される）
      - /app/node_modules # node_modulesは匿名ボリュームとして扱い、ホストを汚染しない
    command: npm run build # ビルドコマンドを実行
    # このサービスはビルドが完了したら終了する。mon-nginx はビルド完了を待たずに起動するが、
    # 静的ファイルはホストの frontend/dist を直接配信するため、ビルドが終われば再起動なしで新しい内容が配信される。

networks:
  monitoring-network:
    driver: bridge
  # mon-docker-proxy 専用（mon-backend のみ）。外向き通信なし
  mon-docker-net:
    driver: bridge
    internal: true
  atmosidea-network:
    external: true
    name: atmosidea-network
