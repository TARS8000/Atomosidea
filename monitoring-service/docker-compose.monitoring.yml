services:
  mon-nginx:
    image: nginx:alpine
    container_name: mon-nginx
    restart: always
    ports:
      # 運用ダッシュボード（MinIO の操作が可能）のため、Basic 認証に加えてホストのループバックのみに公開する
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html:ro # mon-frontendによって生成されるホストのdistディレクトリをマウント
    depends_on:
      - mon-backend
      - mon-frontend # 起動順を mon-frontend の後にするだけ（ビルド完了は待たない。完了前は dist が空または前回のビルド）
    networks:
      - monitoring-network

  mon-backend:
    build:
      context: ./backend
    container_name: mon-backend
    restart: always
    # ログイン（HTTP Basic）。値はプロジェクトルートの .env（scripts/start.bat が --env-file で渡す）。
    # 未設定だと mon-backend は全リクエストを拒否する（fail closed）
    environment:
      MONITOR_USERNAME: ${MONITOR_USERNAME:-}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-}
      # 許可ホストの追加（カンマ区切り、任意）。localhost / 127.0.0.1 / ::1 は常に許可。空・未設定なら追加なし
      MONITORING_ALLOWED_HOSTS: ${MONITORING_ALLOWED_HOSTS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring-network
      - atmosidea-network # 既存のネットワークに接続（MinIO の操作で atmosidea-minio:9000 に到達するため）

  mon-frontend:
    build:
      context: ./frontend
    container_name: mon-frontend-builder
    volumes:
      - ./frontend:/app # ホストのfrontendディレクトリをコンテナの/appにマウント（ビルド成果物は /app/dist = ホストの frontend/dist に出力される）
      - /app/node_modules # node_modulesは匿名ボリュームとして扱い、ホストを汚染しない
    command: npm run build # ビルドコマンドを実行
    # このサービスはビルドが完了したら終了する。mon-nginx はビルド完了を待たずに起動するが、
    # 静的ファイルはホストの frontend/dist を直接配信するため、ビルドが終われば再起動なしで新しい内容が配信される。

networks:
  monitoring-network:
    driver: bridge
  atmosidea-network:
    external: true
    name: atmosidea-network
