server {
    listen 80;
    server_name localhost;

    # mon-backend は MinIO へのアップロードを最大 32MB 程度まで想定する（既定の 1MB だと 413 になる）
    client_max_body_size 32m;

    # UI（静的ファイル）も mon-backend の Basic 認証で保護する（auth_request）。
    # /api と /ws は mon-backend 自身が認証するので auth_request は不要。
    location = /_monitor_auth {
        internal;
        proxy_pass http://mon-backend:8080/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        auth_request /_monitor_auth;
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 転送設定（REST のみ）
    location /api/ {
        proxy_pass http://mon-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket 転送設定（/ws/logs?container=...）
    location /ws {
        proxy_pass http://mon-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
