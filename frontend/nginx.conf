events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ------------------------------------------------------------------
    # Upstream 定義 (ログで確認された各サービスの実際の稼働ポートに設定)
    # ------------------------------------------------------------------
    upstream auth_service { server auth-service:8080; }
    upstream video_upload_service { server video-upload-api:8080; }
    upstream video_worker_service { server video-worker:8081; }             # 8081に修正
    upstream game_upload_api { server game-upload-api:8082; }         # 8082に修正
    upstream mypage_service { server mypage-service:8083; }             # 8083に修正
    upstream profile_service { server profile-service:8084; }           # 8084に修正
    upstream static_site_upload_api { server static-site-upload-api:8085; } # 8085に修正
    upstream team_service { server team-service:8080; }

# MinIO ストレージ (単一 unified MinIO `minio:9000` に統一。bucket 分離は MinIO 側で対応)
upstream game_storage { server minio:9000; }
upstream profile_storage { server minio:9000; }
upstream static_site_storage { server minio:9000; }
upstream video_storage { server minio:9000; }

    # ------------------------------------------------------------------
    # 1. サブドメイン配信用 Server Block (*.localhost)
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name "~^(?<subdomain>[a-z0-9]{10})\.localhost$";
        resolver 127.0.0.11 valid=5s;

        location / {
            # "/" や "/docs/" などディレクトリ指定は index.html を補う。
            # (break を付けると次の rewrite が実行されず、"/index.html" がバケット名として MinIO に渡ってしまう)
            rewrite ^(.*)/$ $1/index.html;
            rewrite ^/(.*)$ /games/$subdomain/$1 break;

            proxy_pass http://game_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;

            error_page 404 = @fallback_static_site;
        }

        location @fallback_static_site {
            rewrite ^/games/[^/]+/(.*)$ /static-sites/$subdomain/$1 break;

            proxy_pass http://static_site_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), fullscreen=(self), payment=(), display-capture=(), clipboard-read=(), publickey-credentials-get=(), autoplay=(self)" always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            expires 3d;
            add_header Cache-Control "public";
        }
    }

    # ------------------------------------------------------------------
    # 2. メインアプリケーション用 Server Block (localhost & default)
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name localhost 127.0.0.1;
        resolver 127.0.0.11 valid=5s;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://localhost http://localhost:3001 blob:; connect-src 'self' http://localhost http://localhost:3001 ws://localhost ws://localhost:3001; media-src 'self' blob:; frame-src 'self' http://*.localhost http://*.localhost:3001;" always;

        # 既定のリクエストボディ上限（画像 10 MiB + multipart のオーバーヘッド）。
        # 大きなファイルを受け付けるアップロード API だけ、下の各 location で上限を引き上げる。
        # 正確な上限はバックエンドが検査する（MAX_*_UPLOAD_BYTES）。
        client_max_body_size 12m;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # --- 内部 API の遮断 ---
        # サービス間の内部 API（/internal/...）は Nginx から転送しない。
        # 正規表現 location はプレフィックス location（/api/profile 等）より優先されるため、
        # ここで先に 404 を返す。/api/profile/internal/ は ^~ で正規表現より前に確定させる。
        location ^~ /api/profile/internal/ {
            return 404;
        }

        location ~ ^/api/.*/internal(/|$) {
            return 404;
        }

        # --- API Routing ---
        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/profile {
            proxy_pass http://profile_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/my {
            proxy_pass http://mypage_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/games {
            proxy_pass http://game_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ゲームのアップロード（zip 1 GiB + サムネイル）
        location /api/games/upload {
            client_max_body_size 1100m;
            proxy_pass http://game_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 静的サイトのアップロード（zip 500 MiB + サムネイル）
        location /api/static-sites/upload {
            client_max_body_size 550m;
            proxy_pass http://static_site_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/static-sites {
            proxy_pass http://static_site_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/teams {
            proxy_pass http://team_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Video Routes
        location /api/videos/upload {
            # 動画 1 GiB + multipart のオーバーヘッド
            client_max_body_size 1100m;
            proxy_request_buffering off;
            proxy_pass http://video_upload_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ ^/api/videos/delete/(?<video_id>[a-zA-Z0-9]+)$ {
            rewrite ^/api/videos/delete/(?<video_id>[a-zA-Z0-9]+)$ /api/videos/$video_id break;
            proxy_pass http://video_upload_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # サムネイル削除は video-upload-api が担当する（/api/videos の残りは video-worker へ流れるため個別に振り分ける）
        location ~ ^/api/videos/[a-zA-Z0-9]+/thumbnail$ {
            proxy_pass http://video_upload_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # HLSはMinIO(video-storage)から配信する。
        # URL /api/videos/<id>/stream/<path> を MinIO のオブジェクトキー videos/<id>/<path> へ変換。
        location ~ '^/api/videos/([a-z0-9]{10})/stream/(.*)$' {
            rewrite '^/api/videos/([a-z0-9]{10})/stream/(.*)$' /videos/$1/$2 break;
            proxy_pass http://video_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # ユーザーがアップロードしたオブジェクトはメインオリジンで配信されるため、
            # HTML/SVG として解釈されてもスクリプトが動かないよう sandbox CSP と nosniff を付与する
            # (location 内で add_header を使うと server レベルのヘッダーは継承されない点に注意)
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Cache-Control' 'public, max-age=3600';
        }

        location /api/videos {
            proxy_pass http://video_worker_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Static Assets & Storage Proxies ---
        location ~ ^/videos/thumbnails/(.+)$ {
            proxy_pass http://video_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # ユーザーがアップロードしたオブジェクトはメインオリジンで配信されるため、
            # HTML/SVG として解釈されてもスクリプトが動かないよう sandbox CSP と nosniff を付与する
            # (location 内で add_header を使うと server レベルのヘッダーは継承されない点に注意)
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            # Thumbnails are replaced on every upload (random object name), so
            # never let the browser/CDN serve a stale cached image.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~ ^/games/thumbnails/(.+) {
            proxy_pass http://game_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # ユーザーがアップロードしたオブジェクトはメインオリジンで配信されるため、
            # HTML/SVG として解釈されてもスクリプトが動かないよう sandbox CSP と nosniff を付与する
            # (location 内で add_header を使うと server レベルのヘッダーは継承されない点に注意)
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            # Thumbnails are replaced on every upload (random object name), so
            # never let the browser/CDN serve a stale cached image.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~ ^/static-sites/thumbnails/(.+)$ {
            proxy_pass http://static_site_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # ユーザーがアップロードしたオブジェクトはメインオリジンで配信されるため、
            # HTML/SVG として解釈されてもスクリプトが動かないよう sandbox CSP と nosniff を付与する
            # (location 内で add_header を使うと server レベルのヘッダーは継承されない点に注意)
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            # Thumbnails are replaced on every upload (random object name), so
            # never let the browser/CDN serve a stale cached image.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~ ^/user-profiles/(.+) {
            rewrite ^/user-profiles/(.+) /user-profiles/$1 break;
            proxy_pass http://profile_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # ユーザーがアップロードしたオブジェクトはメインオリジンで配信されるため、
            # HTML/SVG として解釈されてもスクリプトが動かないよう sandbox CSP と nosniff を付与する
            # (location 内で add_header を使うと server レベルのヘッダーは継承されない点に注意)
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ゲーム本体はアプリと別オリジンの <id>.localhost サブドメインでのみ配信する
        # (game_url もサブドメインを指す)。メインオリジンで配信すると、ゲーム内のスクリプトから
        # localStorage の JWT を読めてしまうため提供しない。
        location ~ '^/games/([a-z0-9]{10})/(.+)$' {
            return 404;
        }
    }
}