events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  30;

    # ------------------------------------------------------------------
    # DoS 対策：タイムアウト
    # ゆっくり送り続けて接続を握り続ける攻撃（Slowloris など）を切る。
    # client_body_timeout は「本文の読み取りと読み取りの間隔」なので、大きなアップロードでも途切れなければ切れない
    # ------------------------------------------------------------------
    client_header_timeout 10s;
    client_body_timeout   60s;
    send_timeout          60s;
    reset_timedout_connection on;

    # ------------------------------------------------------------------
    # DoS 対策：接続元 IP
    # 今（Tailscale 経由）は deskmini が送信元を書き換えるので、全員 172.16.2.1 に見える。
    #   → 下の IP ごとの制限は、当面「サイト全体の上限」として働く。
    # Cloudflare（cloudflared）を前に置いたら、cloudflared は手前のプライベート IP から来るので、
    # そこからのリクエストに限って CF-Connecting-IP を本当の接続元として使う（ヘッダーが無ければ今のまま）。
    # 注意：tailnet の中の人はこのヘッダーを偽れる（その人の制限が甘くなるだけ）。
    # インターネットから直接このポートに届く構成にするなら、set_real_ip_from を cloudflared の IP だけに絞ること
    # ------------------------------------------------------------------
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;

    # ------------------------------------------------------------------
    # DoS 対策：回数と同時接続数の制限（超えたら 429）
    # 値は「今は全員で共有する上限」でも普通の利用で引っかからない程度にしてある。
    # Cloudflare 導入後に 1 人あたりで厳しくしたいときは rate / burst / limit_conn を下げる
    # ------------------------------------------------------------------
    # 回数を数える単位：ログインしている人はトークンごと、していない人は接続元 IP ごと。
    # Tailscale 経由では全員が同じ IP に見えるので、IP だけで数えると 1 人が叩き続けたときに全員が 429 になる。
    # トークンごとに数えれば、ログインしている人どうしは巻き込まれない（ログインしていない閲覧は IP ごとのまま）。
    # Authorization を偽って枠を増やすことはできるが、下の req_ip（接続元ごとの上限）は超えられない
    map $http_authorization $api_limit_key {
        ""      $binary_remote_addr;
        default $http_authorization;
    }
    # API 全般（上のキーごと）
    limit_req_zone  $api_limit_key       zone=req_api:20m    rate=30r/s;
    # 接続元 IP ごとの上限（サーバーを守る安全弁。Tailscale のあいだはサイト全体の上限になるので高めにしてある）
    limit_req_zone  $binary_remote_addr zone=req_ip:10m     rate=200r/s;
    # 分割アップロードの各部分（50 MiB ずつ。上のキーごと）
    limit_req_zone  $api_limit_key       zone=req_chunk:10m  rate=120r/m;
    # MinIO から配信するもの（ゲーム・静的サイト・動画・画像）。接続元 IP ごと
    limit_req_zone  $binary_remote_addr zone=req_static:10m rate=100r/s;
    # ログイン・登録（総当たり対策）
    limit_req_zone  $binary_remote_addr zone=req_auth:10m   rate=20r/m;
    # 大きなアップロード（ゲーム・静的サイト・動画）
    limit_req_zone  $binary_remote_addr zone=req_upload:10m rate=10r/m;
    # IP ごとの同時接続数
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
    # 大きなアップロードのサーバー全体での同時数（一時ファイルでディスクが埋まるのを防ぐ。キーは固定値）
    map $scheme $upload_global_key { default "all"; }
    limit_conn_zone $upload_global_key zone=conn_upload_all:1m;

    # ------------------------------------------------------------------
    # DoS 対策：MinIO から配信するもののキャッシュ
    # 同じファイルへのアクセスが集中しても、MinIO には短い間隔で 1 回しか取りに行かない（proxy_cache_lock）。
    # MinIO が落ちている・遅いときも、キャッシュにあれば古いものを返す（proxy_cache_use_stale）。
    # 中身が差し替わることがあるので、保持は 1 分と短くしてある（動画のセグメントは差し替わらないので長め）
    # ------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/minio levels=1:2 keys_zone=minio_cache:50m max_size=2g inactive=30m use_temp_path=off;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    # ------------------------------------------------------------------
    # Upstream 定義 (ログで確認された各サービスの実際の稼働ポートに設定)
    # ------------------------------------------------------------------
    upstream auth_service { server auth-service:8080; }
    upstream video_upload_service { server video-upload-api:8080; }
    upstream video_worker_service { server video-worker:8081; }             # 8081に修正
    upstream game_upload_api { server game-upload-api:8082; }         # 8082に修正
    upstream mypage_service { server mypage-service:8083; }             # 8083に修正
    upstream profile_service { server profile-service:8084; }           # 8084に修正
    upstream static_site_upload_api { server static-site-upload-api:8085; } # 8085に修正
    upstream team_service { server team-service:8080; }

# MinIO ストレージ (単一 unified MinIO `minio:9000` に統一。bucket 分離は MinIO 側で対応)
upstream game_storage { server minio:9000; }
upstream profile_storage { server minio:9000; }
upstream static_site_storage { server minio:9000; }
upstream video_storage { server minio:9000; }

    # ------------------------------------------------------------------
    # 1. サブドメイン配信用 Server Block (<10 文字の ID>.<APP_URL / STATIC_SITE_DOMAIN のホスト>)
    # ホスト名は固定しない（localhost でも、サーバーのドメインでも同じ設定で動く）。
    # メインのホスト（localhost や 172-16-2-5.sslip.io など）は先頭が 10 文字の英小文字・数字にならないので、ここには来ない
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name "~^(?<subdomain>[a-z0-9]{10})\..+$";

        location / {
            # "/" や "/docs/" などディレクトリ指定は index.html を補う。
            # (break を付けると次の rewrite が実行されず、"/index.html" がバケット名として MinIO に渡ってしまう)
            rewrite ^(.*)/$ $1/index.html;
            rewrite ^/(.*)$ /games/$subdomain/$1 break;

            # DoS 対策：回数制限とキャッシュ（キーの先頭の g| は静的サイト側と分けるため）
            limit_req zone=req_static burst=500 nodelay;
            limit_conn conn_ip 100;
            proxy_cache minio_cache;
            proxy_cache_key "g|$host$request_uri";
            proxy_cache_valid 200 206 1m;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            proxy_pass http://game_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;

            error_page 404 = @fallback_static_site;
        }

        location @fallback_static_site {
            rewrite ^/games/[^/]+/(.*)$ /static-sites/$subdomain/$1 break;

            proxy_cache minio_cache;
            proxy_cache_key "s|$host$request_uri";
            proxy_cache_valid 200 206 1m;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            proxy_pass http://static_site_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), fullscreen=(self), payment=(), display-capture=(), clipboard-read=(), publickey-credentials-get=(), autoplay=(self)" always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            expires 3d;
            add_header Cache-Control "public";
        }
    }

    # ------------------------------------------------------------------
    # 2. メインアプリケーション用 Server Block (localhost & default)
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name localhost 127.0.0.1;

        # $host は開いたときのホスト名（localhost なら従来どおり http://localhost・http://*.localhost になる）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://$host http://$host:3001 blob:; connect-src 'self' http://$host http://$host:3001; media-src 'self' blob:; frame-src 'self' http://*.$host http://*.$host:3001;" always;

        # 既定のリクエストボディ上限（画像 10 MiB + multipart のオーバーヘッド）。
        # 大きなファイルを受け付けるアップロード API だけ、下の各 location で上限を引き上げる。
        # 正確な上限はバックエンドが検査する（MAX_*_UPLOAD_BYTES）。
        client_max_body_size 12m;

        # 制限に引っかかったときはフロントが読めるよう JSON で返す
        error_page 429 = @too_many_requests;
        location @too_many_requests {
            default_type application/json;
            add_header Retry-After 60 always;
            charset utf-8;
            return 429 '{"error":"アクセスが集中しています。少し待ってからお試しください。"}';
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # --- 内部 API の遮断 ---
        # サービス間の内部 API（/internal/...）は Nginx から転送しない。
        # 正規表現 location はプレフィックス location（/api/profile 等）より優先されるため、
        # ここで先に 404 を返す。/api/profile/internal/ は ^~ で正規表現より前に確定させる。
        location ^~ /api/profile/internal/ {
            return 404;
        }

        location ~ ^/api/.*/internal(/|$) {
            return 404;
        }

        # --- API Routing ---
        # 分割アップロード（Cloudflare の 1 リクエスト 100 MB 制限への対応。backend/shared/chunkupload）。
        # 1 回 50 MiB ずつ受け取る。最後の「アップロード完了」は下の /api/*/upload が受ける
        location ~ ^/api/games/upload/chunks(/|$) {
            client_max_body_size 51m;
            proxy_request_buffering off;
            limit_req zone=req_chunk burst=30 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 8;
            proxy_pass http://game_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location ~ ^/api/static-sites/upload/chunks(/|$) {
            client_max_body_size 51m;
            proxy_request_buffering off;
            limit_req zone=req_chunk burst=30 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 8;
            proxy_pass http://static_site_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location ~ ^/api/videos/upload/chunks(/|$) {
            client_max_body_size 51m;
            proxy_request_buffering off;
            limit_req zone=req_chunk burst=30 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 8;
            proxy_pass http://video_upload_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ログイン・登録・OAuth コード交換は回数を厳しく
        location ~ ^/api/auth/(login|register|oauth/exchange)$ {
            limit_req zone=req_auth burst=20 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 50;
            proxy_pass http://auth_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth {
            limit_req zone=req_api burst=100 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 50;
            proxy_pass http://auth_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/profile {
            limit_req zone=req_api burst=100 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 50;
            proxy_pass http://profile_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/my {
            limit_req zone=req_api burst=100 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 50;
            proxy_pass http://mypage_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/games {
            limit_req zone=req_api burst=100 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 50;
            proxy_pass http://game_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ゲームのアップロード（zip 1 GiB + サムネイル）
        location /api/games/upload {
            # 1 IP につき 1 分 10 回まで・同時 3 本まで、サーバー全体でも同時 6 本まで
            limit_req zone=req_upload burst=5 nodelay;
            limit_conn conn_ip 3;
            limit_conn conn_upload_all 6;
            client_max_body_size 1100m;
            proxy_pass http://game_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 静的サイトのアップロード（zip 500 MiB + サムネイル）
        location /api/static-sites/upload {
            # 1 IP につき 1 分 10 回まで・同時 3 本まで、サーバー全体でも同時 6 本まで
            limit_req zone=req_upload burst=5 nodelay;
            limit_conn conn_ip 3;
            limit_conn conn_upload_all 6;
            client_max_body_size 550m;
            proxy_pass http://static_site_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/static-sites {
            limit_req zone=req_api burst=100 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 50;
            proxy_pass http://static_site_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/teams {
            limit_req zone=req_api burst=100 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 50;
            proxy_pass http://team_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Video Routes
        location /api/videos/upload {
            # 1 IP につき 1 分 10 回まで・同時 3 本まで、サーバー全体でも同時 6 本まで
            limit_req zone=req_upload burst=5 nodelay;
            limit_conn conn_ip 3;
            limit_conn conn_upload_all 6;
            # 動画 1 GiB + multipart のオーバーヘッド
            client_max_body_size 1100m;
            proxy_request_buffering off;
            proxy_pass http://video_upload_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ ^/api/videos/delete/(?<video_id>[a-zA-Z0-9]+)$ {
            limit_req zone=req_api burst=100 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 50;
            rewrite ^/api/videos/delete/(?<video_id>[a-zA-Z0-9]+)$ /api/videos/$video_id break;
            proxy_pass http://video_upload_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # サムネイル削除は video-upload-api が担当する（/api/videos の残りは video-worker へ流れるため個別に振り分ける）
        location ~ ^/api/videos/[a-zA-Z0-9]+/thumbnail$ {
            limit_req zone=req_api burst=100 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 50;
            proxy_pass http://video_upload_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # HLSはMinIO(video-storage)から配信する。
        # URL /api/videos/<id>/stream/<path> を MinIO のオブジェクトキー videos/<id>/<path> へ変換。
        location ~ '^/api/videos/([a-z0-9]{10})/stream/(.*)$' {
            rewrite '^/api/videos/([a-z0-9]{10})/stream/(.*)$' /videos/$1/$2 break;
            limit_req zone=req_static burst=500 nodelay;
            limit_conn conn_ip 100;
            proxy_cache minio_cache;
            proxy_cache_key "v|$uri";
            proxy_cache_valid 200 206 10m;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_pass http://video_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # ユーザーがアップロードしたオブジェクトはメインオリジンで配信されるため、
            # HTML/SVG として解釈されてもスクリプトが動かないよう sandbox CSP と nosniff を付与する
            # (location 内で add_header を使うと server レベルのヘッダーは継承されない点に注意)
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Cache-Control' 'public, max-age=3600';
        }

        location /api/videos {
            limit_req zone=req_api burst=100 nodelay;
            limit_req zone=req_ip burst=400 nodelay;
            limit_conn conn_ip 50;
            proxy_pass http://video_worker_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Static Assets & Storage Proxies ---
        location ~ ^/videos/thumbnails/(.+)$ {
            limit_req zone=req_static burst=500 nodelay;
            proxy_cache minio_cache;
            proxy_cache_key "i|$uri";
            proxy_cache_valid 200 1m;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_pass http://video_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # ユーザーがアップロードしたオブジェクトはメインオリジンで配信されるため、
            # HTML/SVG として解釈されてもスクリプトが動かないよう sandbox CSP と nosniff を付与する
            # (location 内で add_header を使うと server レベルのヘッダーは継承されない点に注意)
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            # Thumbnails are replaced on every upload (random object name), so
            # never let the browser/CDN serve a stale cached image.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~ ^/games/thumbnails/(.+) {
            limit_req zone=req_static burst=500 nodelay;
            proxy_cache minio_cache;
            proxy_cache_key "i|$uri";
            proxy_cache_valid 200 1m;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_pass http://game_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # ユーザーがアップロードしたオブジェクトはメインオリジンで配信されるため、
            # HTML/SVG として解釈されてもスクリプトが動かないよう sandbox CSP と nosniff を付与する
            # (location 内で add_header を使うと server レベルのヘッダーは継承されない点に注意)
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            # Thumbnails are replaced on every upload (random object name), so
            # never let the browser/CDN serve a stale cached image.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~ ^/static-sites/thumbnails/(.+)$ {
            limit_req zone=req_static burst=500 nodelay;
            proxy_cache minio_cache;
            proxy_cache_key "i|$uri";
            proxy_cache_valid 200 1m;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_pass http://static_site_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # ユーザーがアップロードしたオブジェクトはメインオリジンで配信されるため、
            # HTML/SVG として解釈されてもスクリプトが動かないよう sandbox CSP と nosniff を付与する
            # (location 内で add_header を使うと server レベルのヘッダーは継承されない点に注意)
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            # Thumbnails are replaced on every upload (random object name), so
            # never let the browser/CDN serve a stale cached image.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~ ^/user-profiles/(.+) {
            limit_req zone=req_static burst=500 nodelay;
            proxy_cache minio_cache;
            proxy_cache_key "i|$uri";
            proxy_cache_valid 200 1m;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_pass http://profile_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # ユーザーがアップロードしたオブジェクトはメインオリジンで配信されるため、
            # HTML/SVG として解釈されてもスクリプトが動かないよう sandbox CSP と nosniff を付与する
            # (location 内で add_header を使うと server レベルのヘッダーは継承されない点に注意)
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ゲーム本体はアプリと別オリジンの <id>.<ホスト> サブドメインでのみ配信する
        # (game_url もサブドメインを指す)。メインオリジンで配信すると、ゲーム内のスクリプトから
        # localStorage の JWT を読めてしまうため提供しない。
        location ~ '^/games/([a-z0-9]{10})/(.+)$' {
            return 404;
        }
    }
}