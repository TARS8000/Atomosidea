events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 基本設定
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ------------------------------------------------------------------
    # Upstream 定義 (実際の内部ポートに修正)
    # ------------------------------------------------------------------
    upstream auth_service { server auth-service:8080; }
    upstream upload_service { server upload-service:8080; }
    upstream stream_service { server stream-service:8081; }
    upstream game_upload_api { server game-upload-api:8082; }
    upstream mypage_service { server mypage-service:8083; }
    upstream profile_service { server profile-service:8084; }
    upstream static_site_upload_api { server static-site-upload-api:8085; }

    # MinIO ストレージ
    upstream game_storage { server game-storage:9000; }
    upstream profile_storage { server profile-storage:9000; }
    upstream static_site_storage { server static-site-storage:9000; }

    # ------------------------------------------------------------------
    # 1. サブドメイン配信用 Server Block (*.localhost)
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name "~^(?<subdomain>[a-z0-9]{10})\.localhost$";
        resolver 127.0.0.11 valid=5s;

        location / {
            rewrite ^/$ /index.html break;
            rewrite ^/(.*)$ /games/$subdomain/$1 break;

            proxy_pass http://game_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;

            error_page 404 = @fallback_static_site;
        }

        location @fallback_static_site {
            # 前段の location / で付与された /games/<subdomain>/ を /static-sites/<subdomain>/ に置き換える
            rewrite ^/games/[^/]+/(.*)$ /static-sites/$subdomain/$1 break;

            proxy_pass http://static_site_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), fullscreen=(self), payment=(), display-capture=(), clipboard-read=(), publickey-credentials-get=(), autoplay=(self)" always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            expires 3d;
            add_header Cache-Control "public";
        }
    }

    # ------------------------------------------------------------------
    # 2. メインアプリケーション用 Server Block (localhost & default)
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name localhost 127.0.0.1;
        resolver 127.0.0.11 valid=5s;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://localhost http://localhost:3001 blob:; connect-src 'self' http://localhost http://localhost:3001 ws://localhost ws://localhost:3001; media-src 'self' blob:; frame-src 'self' http://*.localhost http://*.localhost:3001;" always;

        client_max_body_size 3G;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # --- API Routing ---
        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/profile {
            proxy_pass http://profile_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/my {
            proxy_pass http://mypage_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/games {
            proxy_pass http://game_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/static-sites {
            proxy_pass http://static_site_upload_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Video Routes (順序に依存しない前方一致ルール)
        location /api/videos/upload {
            proxy_pass http://upload_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/videos/delete {
            proxy_pass http://upload_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ '^/api/videos/([a-z0-9]{10})/stream/(.*)$' {
            alias /storage/videos/$1/$2;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Cache-Control' 'public, max-age=3600';
        }

        # 動画取得・一覧 API (stream-service へ)
        location /api/videos {
            proxy_pass http://stream_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Static Assets & Storage Proxies ---
        location /storage/thumbnails/ {
            alias /storage/thumbnails/;
            expires 30d;
            add_header Cache-Control "public";
        }

        location ~ ^/games/thumbnails/(.+) {
            proxy_pass http://game_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # user-profiles 用のリライトを追加して MinIO 転送パスを確定
        location ~ ^/user-profiles/(.+) {
            rewrite ^/user-profiles/(.+) /user-profiles/$1 break;
            proxy_pass http://profile_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ '^/games/([a-z0-9]{10})/(.+)$' {
            proxy_pass http://game_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}