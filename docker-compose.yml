  # ==========================================
  # Security (SFSP Services)
  # ==========================================
  sfsp-api:
    build:
      context: .
      dockerfile: backend/security/sfsp/docker/api/Dockerfile
    container_name: sfsp-api
    restart: always
    depends_on:
      sfsp-db:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SFSP_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sfsp-db:5432/sfsp_db?sslmode=disable"

      # RAW MinIO 設定 (sfsp-api-policy: raw-files のみ操作可能な専用ユーザー)
      SFSP_RAW_MINIO_ENDPOINT: "minio:9000"
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_API_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_API_SECRET_KEY}

      # Clean MinIO 設定
      SFSP_CLEAN_MINIO_ENDPOINT: "minio:9000"
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_API_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_API_SECRET_KEY}

      SFSP_MINIO_USE_SSL: "false"
      <<: [*redis-env, *redis-url-env]
      SFSP_API_KEY: ${SFSP_API_KEY:?SFSP_API_KEY must be set in .env}
      # 1 ファイルのアップロード上限（既定値は internal/config/config.go と同じ）
      SFSP_MAX_UPLOAD_BYTES: ${SFSP_MAX_UPLOAD_BYTES:-2147483647}
      SFSP_MINIO_BUCKET_RAW_FILES: raw-files
      SFSP_MINIO_BUCKET_CLEAN_FILES: clean-files
      SFSP_MINIO_BUCKET_QUARANTINE: quarantine
    networks:
      - sfsp-isolated-net # redis, minio, 呼び出し元のサービス
      - sfsp-db-network # sfsp-db

  # sfsp-worker に Docker ソケットを直接渡さないためのプロキシ。
  # サンドボックスに必要な API（/containers, /images, /_ping, /version）だけを許可し、
  # /exec・volumes・networks・build・swarm・system などは拒否する。
  # 注意: リクエスト本文（Privileged や Binds など）は検査せず、/containers/{id}/exec も CONTAINERS に含まれるため、
  # 完全な隔離ではない（sfsp-worker が乗っ取られた場合の攻撃面を減らすためのもの）
  sfsp-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: sfsp-docker-proxy
    restart: always
    # 既定の HAProxy のタイムアウト（10 分）はサンドボックスの上限（sandboxTimeout = 30 分）より短く、
    # 長いスキャンの ContainerWait が 504 で切れるため 35 分に延ばしてから元の entrypoint を実行する
    entrypoint:
      - sh
      - -c
      - sed -i -e 's/timeout client 10m/timeout client 35m/' -e 's/timeout server 10m/timeout server 35m/' /usr/local/etc/haproxy/haproxy.cfg.template && exec docker-entrypoint.sh haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    environment:
      CONTAINERS: 1 # create / start / wait / logs / delete / inspect
      IMAGES: 1 # ImageInspect / ImagePull（イメージが無いとき）
      POST: 1 # GET/HEAD 以外（create, start, wait, delete, pull）を許可
      PING: 1
      VERSION: 1 # API バージョンのネゴシエーション
      EVENTS: 0
      INFO: 0
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      BUILD: 0
      COMMIT: 0
      SYSTEM: 0
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SWARM: 0
      DISTRIBUTION: 0
      SESSION: 0
      GRPC: 0
      ALLOW_RESTARTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - sfsp-docker-net

  sfsp-worker:
    build:
      context: .
      dockerfile: backend/security/sfsp/docker/worker/Dockerfile
    container_name: sfsp-worker
    restart: always
    # .env 全体は渡さない（env_file も ./.env のマウントも無し）。必要な変数は下の environment に明示する。
    # internal/config/config.go と shared/config は .env が無ければ環境変数だけで動く
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      sfsp-db:
        condition: service_started
      app-db:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
      sfsp-clamav-client:
        condition: service_started
      sfsp-yara-client:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      db-role-init:
        condition: service_completed_successfully
      sfsp-docker-proxy:
        condition: service_started
      sfsp-scan-volume-init:
        condition: service_completed_successfully
    # Dockerfile で USER 10001:10001 にしてある（docker/worker/Dockerfile）。Docker ソケットは持たない
    environment:
      SFSP_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sfsp-db:5432/sfsp_db?sslmode=disable"
      APP_DATABASE_URL: "postgres://sfsp_worker:${SFSP_WORKER_DB_PASSWORD:?SFSP_WORKER_DB_PASSWORD must be set in .env}@app-db:5432/app_db?sslmode=disable"

      # Explicit source (raw) and destination (clean) endpoints
      SFSP_RAW_MINIO_ENDPOINT: "minio:9000"
      SFSP_CLEAN_MINIO_ENDPOINT: "minio:9000"
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_WORKER_RAW_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_WORKER_RAW_SECRET_KEY}
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_WORKER_CLEAN_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_WORKER_CLEAN_SECRET_KEY}
      SFSP_MINIO_USE_SSL: "false"

      <<: [*redis-env, *redis-url-env]
      # Docker API は sfsp-docker-proxy 経由（sandbox/docker.go は client.FromEnv で DOCKER_HOST を読む）
      DOCKER_HOST: tcp://sfsp-docker-proxy:2375
      SFSP_SCANNER_CLAMAV_IMAGE: "${SFSP_SCANNER_CLAMAV_IMAGE:-sfsp-clamav-client:latest}"
      SFSP_SCANNER_YARA_IMAGE: "${SFSP_SCANNER_YARA_IMAGE:-sfsp-yara-client:latest}"
      SFSP_SCANNER_YARA_RULES_PATH: "${SFSP_SCANNER_YARA_RULES_PATH:-/etc/yara-rules/general.yar}"
      SFSP_SCAN_VOLUME_NAME: sfsp_temp_scan
      SFSP_MINIO_BUCKET_RAW_FILES: raw-files
      SFSP_MINIO_BUCKET_CLEAN_FILES: clean-files
      SFSP_MINIO_BUCKET_QUARANTINE: quarantine
      # ClamAV の上限と zip 展開の上限。既定値は internal/config/config.go の既定値と同じ（.env で上書き可）
      SFSP_CLAMAV_MAX_FILESIZE: ${SFSP_CLAMAV_MAX_FILESIZE:-2147483647}
      SFSP_CLAMAV_MAX_SCANSIZE: ${SFSP_CLAMAV_MAX_SCANSIZE:-4194304000}
      SFSP_CLAMAV_MAX_FILES: ${SFSP_CLAMAV_MAX_FILES:-100000}
      SFSP_CLAMAV_MAX_RECURSION: ${SFSP_CLAMAV_MAX_RECURSION:-64}
      SFSP_CLAMAV_MAX_DIR_RECURSION: ${SFSP_CLAMAV_MAX_DIR_RECURSION:-64}
      SFSP_CLAMAV_MAX_SCANTIME_MS: ${SFSP_CLAMAV_MAX_SCANTIME_MS:-1500000}
      SFSP_CLAMAV_PCRE_MAX_FILESIZE: ${SFSP_CLAMAV_PCRE_MAX_FILESIZE:-2147483647}
      SFSP_MAX_EXTRACTED_BYTES: ${SFSP_MAX_EXTRACTED_BYTES:-4294967296}
      SFSP_MAX_ZIP_ENTRIES: ${SFSP_MAX_ZIP_ENTRIES:-20000}
      SFSP_MAX_ZIP_ENTRY_BYTES: ${SFSP_MAX_ZIP_ENTRY_BYTES:-2147483647}
      SFSP_MAX_ZIP_RATIO: ${SFSP_MAX_ZIP_RATIO:-1000}
      SFSP_MAX_ZIP_DEPTH: ${SFSP_MAX_ZIP_DEPTH:-32}
    volumes:
      # YARA ルールはサンドボックス側（sfsp-yara-client イメージの /etc/yara-rules）に焼き込まれており、worker 自身は読まない。
      # サンドボックスにも同じ名前付きボリューム（SFSP_SCAN_VOLUME_NAME）を /scan_target に読み取り専用でマウントする。
      # プロキシ経由でも同じ Docker デーモンなので、ボリューム名はそのまま解決される
      - sfsp_temp_scan:/tmp/sfsp-scan
    networks:
      - sfsp-isolated-net # redis, minio
      - backend-db-network # app-db（sfsp_worker ロール、読み取り専用）
      - sfsp-db-network # sfsp-db
      - sfsp-docker-net # sfsp-docker-proxy

  # sfsp-worker（uid/gid 10001 の非 root）が sfsp_temp_scan に書けるようにする 1 回限りの初期化。
  # 空の名前付きボリュームはイメージ側の所有者（10001）で作られるが、非 root 化前に作られた既存ボリュームは root 所有のままなので chown で揃える。
  # ネットワークなし・読み取り専用ルート・CAP_CHOWN のみで、ビルド済みの sfsp-yara-client イメージ（alpine）を root で使う
  sfsp-scan-volume-init:
    image: sfsp-yara-client:latest
    container_name: sfsp-scan-volume-init
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c", "chmod 0755 /tmp/sfsp-scan && chown -R 10001:10001 /tmp/sfsp-scan"]
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    # 2 回目以降の起動ではディレクトリが 10001 所有になっているため、chmod に FOWNER、
    # 0700 の job ディレクトリをたどる chown -R に DAC_READ_SEARCH が必要（外すと再起動のたびに失敗し sfsp-worker が起動しない）
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    volumes:
      - sfsp_temp_scan:/tmp/sfsp-scan
    depends_on:
      sfsp-yara-client:
        condition: service_completed_successfully

  sfsp-clamav-client:
    build:
      context: .
      dockerfile: backend/security/sfsp/docker/clamav-client/Dockerfile
    image: sfsp-clamav-client:latest
    container_name: sfsp-clamav-client-builder
    restart: "no"
    # イメージをビルドするためだけのサービス（echo して終了）。<project>_default ネットワークを作らないようネットワーク無しにする
    network_mode: none
    command: ["echo", "ClamAV client image built"]

  sfsp-yara-client:
    build:
      context: .
      dockerfile: backend/security/sfsp/docker/yara-client/Dockerfile
    image: sfsp-yara-client:latest
    container_name: sfsp-yara-client-builder
    restart: "no"
    network_mode: none
    command: ["echo", "YARA client image built"]

# ==========================================
# Networks & Volumes
# ==========================================
# atmosidea-network だけが外部に出られる（Google OAuth を使う auth-service、ポートを公開する frontend など）。
# それ以外は internal: true（外向き通信なし・ポート公開不可）。DNS によるコンテナ間の名前解決は使える。
# internal の値を変えたネットワークは作り直しが必要（docker compose down → up）。
networks:
  atmosidea-network:
    driver: bridge
    name: atmosidea-network
  # アプリ用 DB（auth-db, app-db, profile-db, team-db）と、それを使うサービス
  backend-db-network:
    driver: bridge
    name: backend-db-network
    internal: true
  # Redis / MinIO / sfsp-api と、それを使うサービス
  sfsp-isolated-net:
    driver: bridge
    name: sfsp-isolated-net
    internal: true
  # sfsp-db 専用（sfsp-api, sfsp-worker のみ）
  sfsp-db-network:
    driver: bridge
    name: sfsp-db-network
    internal: true
  # sfsp-docker-proxy 専用（sfsp-worker のみ）
  sfsp-docker-net:
    driver: bridge
    name: sfsp-docker-net
    internal: true

volumes:
  sfsp_temp_scan:
    name: sfsp_temp_scan
  auth_db_data:
  app_db_data:
  profile_db_data:
  team_db_data:
  sfsp_db_data:
