services:
  # ==========================================
  # Database Services (内部接続のみ)
  # ==========================================
  auth-db:
    image: postgres:16
    container_name: atmosidea-auth-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth_db
      AUTH_SERVICE_DB_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      MYPAGE_SERVICE_DB_PASSWORD: ${MYPAGE_SERVICE_DB_PASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./backend/auth/auth-datebase/auth-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-db-network

  app-db:
    image: postgres:16
    container_name: atmosidea-app-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app_db
    volumes:
      - app_db_data:/var/lib/postgresql/data
      - ./backend/datebase/app-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-db-network

  profile-db:
    image: postgres:16
    container_name: atmosidea-profile-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: profile_db
    volumes:
      - profile_db_data:/var/lib/postgresql/data
      - ./backend/profile-service/profile-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-db-network

  team-db:
    image: postgres:16
    container_name: atmosidea-team-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: team_db
      TEAM_SERVICE_DB_PASSWORD: ${TEAM_SERVICE_DB_PASSWORD}
    volumes:
      - team_db_data:/var/lib/postgresql/data
      - ./backend/team-service/team-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-db-network

  sfsp-db:
    image: postgres:16
    container_name: sfsp-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sfsp_db
    volumes:
      - sfsp_db_data:/var/lib/postgresql/data
      - ./backend/security/sfsp-db:/docker-entrypoint-initdb.d
    networks:
      - backend-db-network
      - sfsp-isolated-net

  # ==========================================
  # Cache Service (内部接続のみ)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: atmosidea-redis
    restart: always
    networks:
      - atmosidea-network
      - sfsp-isolated-net

  # ==========================================
  # Storage Service (Unified MinIO, bucket-level separation)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: atmosidea-minio
    restart: always
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./backend/storage_data:/data
    networks:
      - atmosidea-network
      - sfsp-isolated-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # MinIO バケット自動初期化サービス
  # ==========================================
  minio-init:
    image: minio/mc:latest
    container_name: atmosidea-minio-init
    restart: "no"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SFSP_UPLOAD_ACCESS_KEY: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_UPLOAD_SECRET_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_API_ACCESS_KEY: ${SFSP_API_ACCESS_KEY}
      SFSP_API_SECRET_KEY: ${SFSP_API_SECRET_KEY}
      SFSP_GAME_WORKER_ACCESS_KEY: ${SFSP_GAME_WORKER_ACCESS_KEY}
      SFSP_GAME_WORKER_SECRET_KEY: ${SFSP_GAME_WORKER_SECRET_KEY}
      SFSP_STATIC_SITE_WORKER_ACCESS_KEY: ${SFSP_STATIC_SITE_WORKER_ACCESS_KEY}
      SFSP_STATIC_SITE_WORKER_SECRET_KEY: ${SFSP_STATIC_SITE_WORKER_SECRET_KEY}
      SFSP_PROFILE_WORKER_ACCESS_KEY: ${SFSP_PROFILE_WORKER_ACCESS_KEY}
      SFSP_PROFILE_WORKER_SECRET_KEY: ${SFSP_PROFILE_WORKER_SECRET_KEY}
      SFSP_VIDEO_WORKER_ACCESS_KEY: ${SFSP_VIDEO_WORKER_ACCESS_KEY}
      SFSP_VIDEO_WORKER_SECRET_KEY: ${SFSP_VIDEO_WORKER_SECRET_KEY}
      SFSP_WORKER_RAW_ACCESS_KEY: ${SFSP_WORKER_RAW_ACCESS_KEY}
      SFSP_WORKER_RAW_SECRET_KEY: ${SFSP_WORKER_RAW_SECRET_KEY}
      SFSP_WORKER_CLEAN_ACCESS_KEY: ${SFSP_WORKER_CLEAN_ACCESS_KEY}
      SFSP_WORKER_CLEAN_SECRET_KEY: ${SFSP_WORKER_CLEAN_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until mc alias set myminio http://minio:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\"; do sleep 1; done;
      mc admin info myminio;

      set -e;

      echo 'Creating buckets...';
      mc mb --ignore-existing myminio/user-profiles;
      mc anonymous set download myminio/user-profiles;
      mc mb --ignore-existing myminio/static-sites;
      mc anonymous set download myminio/static-sites;
      mc mb --ignore-existing myminio/videos;
      mc anonymous set download myminio/videos;
      mc mb --ignore-existing myminio/games;
      mc anonymous set download myminio/games;
      mc mb --ignore-existing myminio/raw-files;
      mc mb --ignore-existing myminio/clean-files;
      mc mb --ignore-existing myminio/quarantine;

      echo 'Creating and updating policies...';
      mc admin policy create myminio sfsp-upload-policy /tmp/sfsp-upload-policy.json;
      mc admin policy create myminio sfsp-api-policy /tmp/sfsp-api-policy.json;
      mc admin policy create myminio sfsp-game-worker-policy /tmp/sfsp-game-worker-policy.json;
      mc admin policy create myminio sfsp-static-site-worker-policy /tmp/sfsp-static-site-worker-policy.json;
      mc admin policy create myminio sfsp-profile-worker-policy /tmp/sfsp-profile-worker-policy.json;
      mc admin policy create myminio sfsp-video-worker-policy /tmp/sfsp-video-worker-policy.json;
      mc admin policy create myminio sfsp-worker-raw-policy /tmp/sfsp-worker-raw-policy.json;
      mc admin policy create myminio sfsp-worker-clean-policy /tmp/sfsp-worker-clean-policy.json;

      echo 'Creating users and attaching policies...';
      mc admin user add myminio \"$SFSP_UPLOAD_ACCESS_KEY\" \"$SFSP_UPLOAD_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-upload-policy --user=\"$SFSP_UPLOAD_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_API_ACCESS_KEY\" \"$SFSP_API_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-api-policy --user=\"$SFSP_API_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_GAME_WORKER_ACCESS_KEY\" \"$SFSP_GAME_WORKER_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-game-worker-policy --user=\"$SFSP_GAME_WORKER_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_STATIC_SITE_WORKER_ACCESS_KEY\" \"$SFSP_STATIC_SITE_WORKER_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-static-site-worker-policy --user=\"$SFSP_STATIC_SITE_WORKER_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_PROFILE_WORKER_ACCESS_KEY\" \"$SFSP_PROFILE_WORKER_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-profile-worker-policy --user=\"$SFSP_PROFILE_WORKER_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_VIDEO_WORKER_ACCESS_KEY\" \"$SFSP_VIDEO_WORKER_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-video-worker-policy --user=\"$SFSP_VIDEO_WORKER_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_WORKER_RAW_ACCESS_KEY\" \"$SFSP_WORKER_RAW_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-worker-raw-policy --user=\"$SFSP_WORKER_RAW_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_WORKER_CLEAN_ACCESS_KEY\" \"$SFSP_WORKER_CLEAN_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-worker-clean-policy --user=\"$SFSP_WORKER_CLEAN_ACCESS_KEY\" || true;

      echo 'All MinIO buckets and SFSP policies/users initialized successfully!';
      "
    volumes:
      - ./backend/minio-init/sfsp-upload-policy.json:/tmp/sfsp-upload-policy.json:ro
      - ./backend/minio-init/sfsp-api-policy.json:/tmp/sfsp-api-policy.json:ro
      - ./backend/minio-init/sfsp-game-worker-policy.json:/tmp/sfsp-game-worker-policy.json:ro
      - ./backend/minio-init/sfsp-static-site-worker-policy.json:/tmp/sfsp-static-site-worker-policy.json:ro
      - ./backend/minio-init/sfsp-profile-worker-policy.json:/tmp/sfsp-profile-worker-policy.json:ro
      - ./backend/minio-init/sfsp-video-worker-policy.json:/tmp/sfsp-video-worker-policy.json:ro
      - ./backend/minio-init/sfsp-worker-raw-policy.json:/tmp/sfsp-worker-raw-policy.json:ro
      - ./backend/minio-init/sfsp-worker-clean-policy.json:/tmp/sfsp-worker-clean-policy.json:ro
    networks:
      - atmosidea-network
      - sfsp-isolated-net

  # ==========================================
  # Application Services & Microservices
  # ==========================================
  frontend:
    build:
      context: ./frontend
      args:
        CACHE_BUSTER: ${CACHE_BUSTER}
        VITE_STATIC_SITE_DOMAIN: ${STATIC_SITE_DOMAIN}
    container_name: atmosidea-frontend
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_started
      video-upload-api:
        condition: service_started
      video-worker:
        condition: service_started
      game-upload-api:
        condition: service_started
      mypage-service:
        condition: service_started
      profile-service:
        condition: service_started
      static-site-upload-api:
        condition: service_started
    networks:
      - atmosidea-network

  auth-service:
    build:
      context: .
      dockerfile: backend/auth/auth-worker/Dockerfile
    container_name: atmosidea-auth-service
    restart: always
    env_file:
      - .env
    depends_on:
      auth-db:
        condition: service_started
      app-db:
        condition: service_started
      redis:
        condition: service_started
      profile-service:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      PROFILE_SERVICE_URL: "http://profile-service:8084"
      DATABASE_URL: "postgres://auth_service_user:${AUTH_SERVICE_DB_PASSWORD}@auth-db:5432/auth_db?sslmode=disable"
      APP_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_URL: ${APP_URL}
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE}
      MINIO_ENDPOINT: minio:9000
      PROFILE_MINIO_ACCESS_KEY_ID: ${PROFILE_MINIO_ACCESS_KEY_ID}
      PROFILE_MINIO_SECRET_ACCESS_KEY: ${PROFILE_MINIO_SECRET_ACCESS_KEY}
      GAME_MINIO_ENDPOINT: minio:9000
      GAME_MINIO_ACCESS_KEY_ID: ${GAME_MINIO_ACCESS_KEY_ID}
      GAME_MINIO_SECRET_ACCESS_KEY: ${GAME_MINIO_SECRET_ACCESS_KEY}
      STATIC_SITE_MINIO_ENDPOINT: minio:9000
      STATIC_SITE_MINIO_ACCESS_KEY_ID: ${STATIC_SITE_MINIO_ACCESS_KEY_ID}
      STATIC_SITE_MINIO_SECRET_ACCESS_KEY: ${STATIC_SITE_MINIO_SECRET_ACCESS_KEY}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    networks:
      - atmosidea-network
      - backend-db-network

  profile-service:
    build:
      context: .
      dockerfile: backend/profile-service/profile-worker/Dockerfile
    container_name: atmosidea-profile-service
    restart: always
    env_file:
      - .env
    depends_on:
      profile-db:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      sfsp-api:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@profile-db:5432/profile_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_ID: ${PROFILE_MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${PROFILE_MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET_NAME: user-profiles
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      SFSP_API_URL: http://sfsp-api:8080
      SFSP_MINIO_ENDPOINT: minio:9000
      SFSP_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_RAW_MINIO_ENDPOINT: minio:9000
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_CLEAN_MINIO_ENDPOINT: minio:9000
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_PROFILE_WORKER_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_PROFILE_WORKER_SECRET_KEY}
      SFSP_MINIO_USE_SSL: "false"
      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    networks:
      - atmosidea-network
      - backend-db-network

  team-service:
    build:
      context: .
      dockerfile: backend/team-service/team-worker/Dockerfile
    container_name: atmosidea-team-service
    restart: always
    env_file:
      - .env
    depends_on:
      team-db:
        condition: service_started
    environment:
      TEAM_DATABASE_URL: "postgres://team_service_user:${TEAM_SERVICE_DB_PASSWORD}@team-db:5432/team_db?sslmode=disable"
      APP_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - atmosidea-network
      - backend-db-network

  video-upload-api:
    build:
      context: .
      dockerfile: backend/video-service/video-upload-api/Dockerfile
    container_name: atmosidea-video-upload-api
    restart: always
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      sfsp-api:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /storage/videos
      THUMBNAIL_DIR: /storage/thumbnails
      VIDEO_MINIO_ENDPOINT: minio:9000
      VIDEO_MINIO_ACCESS_KEY_ID: ${VIDEO_MINIO_ACCESS_KEY_ID:-minioadmin}
      VIDEO_MINIO_SECRET_ACCESS_KEY: ${VIDEO_MINIO_SECRET_ACCESS_KEY:-minioadminpassword}
      SFSP_MINIO_ENDPOINT: minio:9000
      SFSP_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_RAW_MINIO_ENDPOINT: minio:9000
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_CLEAN_MINIO_ENDPOINT: minio:9000
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_WORKER_CLEAN_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_WORKER_CLEAN_SECRET_KEY}
      SFSP_MINIO_USE_SSL: "false"
      SFSP_API_URL: http://sfsp-api:8080
      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend/video-service/upload_workdir:/storage
    networks:
      - atmosidea-network
      - backend-db-network
      - sfsp-isolated-net

  video-worker:
    build:
      context: .
      dockerfile: backend/video-service/video-worker/Dockerfile
    container_name: atmosidea-video-worker
    restart: always
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      UPLOAD_DIR: /storage/videos
      THUMBNAIL_DIR: /storage/thumbnails
      VIDEO_MINIO_ENDPOINT: minio:9000
      VIDEO_MINIO_ACCESS_KEY_ID: ${VIDEO_MINIO_ACCESS_KEY_ID:-minioadmin}
      VIDEO_MINIO_SECRET_ACCESS_KEY: ${VIDEO_MINIO_SECRET_ACCESS_KEY:-minioadminpassword}
      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      SFSP_API_URL: http://sfsp-api:8080
      SFSP_MINIO_ENDPOINT: minio:9000
      SFSP_MINIO_ACCESS_KEY_ID: ${SFSP_VIDEO_WORKER_ACCESS_KEY}
      SFSP_MINIO_SECRET_ACCESS_KEY: ${SFSP_VIDEO_WORKER_SECRET_KEY}
      SFSP_RAW_MINIO_ENDPOINT: minio:9000
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_CLEAN_MINIO_ENDPOINT: minio:9000
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_VIDEO_WORKER_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_VIDEO_WORKER_SECRET_KEY}
      SFSP_CLEAN_MINIO_USE_SSL: "false"
      SFSP_MINIO_USE_SSL: "false"
      APP_URL: ${APP_URL}
    volumes:
      - ./backend/video-service/upload_workdir:/storage:ro
    networks:
      - atmosidea-network
      - backend-db-network
      - sfsp-isolated-net

  game-upload-api:
    build:
      context: .
      dockerfile: backend/game-service/game-upload-api/Dockerfile
    container_name: atmosidea-game-upload-api
    restart: always
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      sfsp-api:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_ID: ${GAME_MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${GAME_MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET_NAME: games
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      SFSP_MINIO_ENDPOINT: minio:9000
      SFSP_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_RAW_MINIO_ENDPOINT: minio:9000
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_CLEAN_MINIO_ENDPOINT: minio:9000
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_GAME_WORKER_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_GAME_WORKER_SECRET_KEY}
      SFSP_MINIO_USE_SSL: "false"
      SFSP_API_URL: http://sfsp-api:8080
      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    networks:
      - atmosidea-network
      - backend-db-network
      - sfsp-isolated-net

  game-worker:
    build:
      context: .
      dockerfile: backend/game-service/game-worker/Dockerfile
    container_name: atmosidea-game-worker
    restart: always
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_ID: ${GAME_MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${GAME_MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET_NAME: games
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      SFSP_MINIO_ENDPOINT: minio:9000
      SFSP_MINIO_ACCESS_KEY_ID: ${SFSP_GAME_WORKER_ACCESS_KEY}
      SFSP_MINIO_SECRET_ACCESS_KEY: ${SFSP_GAME_WORKER_SECRET_KEY}
      SFSP_RAW_MINIO_ENDPOINT: minio:9000
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_CLEAN_MINIO_ENDPOINT: minio:9000
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_GAME_WORKER_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_GAME_WORKER_SECRET_KEY}
      SFSP_MINIO_USE_SSL: "false"
      APP_URL: ${APP_URL}
    networks:
      - atmosidea-network
      - backend-db-network
      - sfsp-isolated-net

  static-site-upload-api:
    build:
      context: .
      dockerfile: backend/static-site-service/static-site-upload-api/Dockerfile
    container_name: atmosidea-static-site-upload-api
    restart: always
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      sfsp-api:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_ID: ${STATIC_SITE_MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${STATIC_SITE_MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET_NAME: static-sites
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      SFSP_MINIO_ENDPOINT: minio:9000
      SFSP_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_RAW_MINIO_ENDPOINT: minio:9000
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_CLEAN_MINIO_ENDPOINT: minio:9000
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_STATIC_SITE_WORKER_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_STATIC_SITE_WORKER_SECRET_KEY}
      SFSP_MINIO_USE_SSL: "false"
      SFSP_API_URL: http://sfsp-api:8080
      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    networks:
      - atmosidea-network
      - backend-db-network
      - sfsp-isolated-net

  static-site-worker:
    build:
      context: .
      dockerfile: backend/static-site-service/static-site-worker/Dockerfile
    container_name: atmosidea-static-site-worker
    restart: always
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_ID: ${STATIC_SITE_MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${STATIC_SITE_MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET_NAME: static-sites
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      SFSP_MINIO_ENDPOINT: minio:9000
      SFSP_MINIO_ACCESS_KEY_ID: ${SFSP_STATIC_SITE_WORKER_ACCESS_KEY}
      SFSP_MINIO_SECRET_ACCESS_KEY: ${SFSP_STATIC_SITE_WORKER_SECRET_KEY}
      SFSP_RAW_MINIO_ENDPOINT: minio:9000
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_UPLOAD_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_UPLOAD_SECRET_KEY}
      SFSP_CLEAN_MINIO_ENDPOINT: minio:9000
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_STATIC_SITE_WORKER_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_STATIC_SITE_WORKER_SECRET_KEY}
      SFSP_MINIO_USE_SSL: "false"
      APP_URL: ${APP_URL}
    networks:
      - atmosidea-network
      - backend-db-network
      - sfsp-isolated-net

  mypage-service:
    build:
      context: .
      dockerfile: backend/profile-service/mypage-worker/Dockerfile
    container_name: atmosidea-mypage-service
    restart: always
    env_file:
      - .env
    depends_on:
      auth-db:
        condition: service_started
      app-db:
        condition: service_started
    environment:
      AUTH_DATABASE_URL: "postgres://mypage_service_user:${MYPAGE_SERVICE_DB_PASSWORD}@auth-db:5432/auth_db?sslmode=disable"
      APP_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - atmosidea-network
      - backend-db-network

  # ==========================================
  # Security (SFSP Services)
  # ==========================================
  sfsp-api:
    build:
      context: .
      dockerfile: backend/security/sfsp/docker/api/Dockerfile
    container_name: sfsp-api
    restart: always
    env_file:
      - .env
    depends_on:
      sfsp-db:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SFSP_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sfsp-db:5432/sfsp_db?sslmode=disable"

      # RAW MinIO 設定 (ROOT 権限キーに変更)
      SFSP_MINIO_ENDPOINT: "minio:9000"
      SFSP_MINIO_ACCESS_KEY_ID: ${SFSP_RAW_MINIO_ROOT_ACCESS_KEY}
      SFSP_MINIO_SECRET_ACCESS_KEY: ${SFSP_RAW_MINIO_ROOT_SECRET_KEY}
      SFSP_RAW_MINIO_ENDPOINT: "minio:9000"
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_RAW_MINIO_ROOT_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_RAW_MINIO_ROOT_SECRET_KEY}

      # Clean MinIO 設定
      SFSP_CLEAN_MINIO_ENDPOINT: "minio:9000"
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_API_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_API_SECRET_KEY}

      SFSP_MINIO_USE_SSL: "false"
      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      SFSP_MINIO_BUCKET_RAW_FILES: raw-files
      SFSP_MINIO_BUCKET_CLEAN_FILES: clean-files
      SFSP_MINIO_BUCKET_QUARANTINE: quarantine
    networks:
      - sfsp-isolated-net
      - backend-db-network

  sfsp-worker:
    build:
      context: .
      dockerfile: backend/security/sfsp/docker/worker/Dockerfile
    container_name: sfsp-worker
    restart: always
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      sfsp-db:
        condition: service_started
      app-db:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
      sfsp-clamav-client:
        condition: service_started
      sfsp-yara-client:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SFSP_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sfsp-db:5432/sfsp_db?sslmode=disable"
      APP_DATABASE_URL: "postgres://${SFSP_WORKER_DB_USER:-sfsp_worker}:${SFSP_WORKER_DB_PASSWORD:-sfsp_worker_password}@app-db:5432/app_db?sslmode=disable"

      # デフォルトエンドポイントを minio:9000 に指定
      SFSP_MINIO_ENDPOINT: "minio:9000"
      SFSP_MINIO_ACCESS_KEY_ID: ${SFSP_WORKER_RAW_ACCESS_KEY}
      SFSP_MINIO_SECRET_ACCESS_KEY: ${SFSP_WORKER_RAW_SECRET_KEY}

      # Explicit source (raw) and destination (clean) endpoints
      SFSP_RAW_MINIO_ENDPOINT: "minio:9000"
      SFSP_CLEAN_MINIO_ENDPOINT: "minio:9000"
      SFSP_RAW_MINIO_ACCESS_KEY_ID: ${SFSP_WORKER_RAW_ACCESS_KEY}
      SFSP_RAW_MINIO_SECRET_ACCESS_KEY: ${SFSP_WORKER_RAW_SECRET_KEY}
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_WORKER_CLEAN_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_WORKER_CLEAN_SECRET_KEY}
      SFSP_MINIO_USE_SSL: "false"

      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      DOCKER_HOST: unix:///var/run/docker.sock
      SFSP_SCANNER_CLAMAV_IMAGE: "${SFSP_SCANNER_CLAMAV_IMAGE:-sfsp-clamav-client:latest}"
      SFSP_SCANNER_YARA_IMAGE: "${SFSP_SCANNER_YARA_IMAGE:-sfsp-yara-client:latest}"
      SFSP_SCANNER_YARA_RULES_PATH: "${SFSP_SCANNER_YARA_RULES_PATH:-/etc/yara-rules/general.yar}"
      SFSP_SCAN_VOLUME_NAME: sfsp_temp_scan
      SFSP_MINIO_BUCKET_RAW_FILES: raw-files
      SFSP_MINIO_BUCKET_CLEAN_FILES: clean-files
      SFSP_MINIO_BUCKET_QUARANTINE: quarantine
    volumes:
      - ./.env:/app/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/security/sfsp/yara-rules:/etc/yara-rules:ro
      - sfsp_temp_scan:/tmp/sfsp-scan
    networks:
      - sfsp-isolated-net
      - backend-db-network

  sfsp-clamav-client:
    build:
      context: .
      dockerfile: backend/security/sfsp/docker/clamav-client/Dockerfile
    image: sfsp-clamav-client:latest
    container_name: sfsp-clamav-client-builder
    restart: "no"
    command: ["echo", "ClamAV client image built"]

  sfsp-yara-client:
    build:
      context: .
      dockerfile: backend/security/sfsp/docker/yara-client/Dockerfile
    image: sfsp-yara-client:latest
    container_name: sfsp-yara-client-builder
    restart: "no"
    command: ["echo", "YARA client image built"]

# ==========================================
# Networks & Volumes
# ==========================================
networks:
  atmosidea-network:
    driver: bridge
    name: atmosidea-network
  backend-db-network:
    driver: bridge
    name: backend-db-network
  sfsp-isolated-net:
    driver: bridge
    name: sfsp-isolated-net

volumes:
  sfsp_temp_scan:
    name: sfsp_temp_scan
  auth_db_data:
  app_db_data:
  profile_db_data:
  team_db_data:
  sfsp_db_data: