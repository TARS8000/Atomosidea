# ==========================================
# 共通の環境変数（YAML アンカー。各サービスの environment に `<<:` で取り込む）
# ==========================================
# 各サービスは .env 全体（env_file）を受け取らない。コードが読む変数だけを environment に明示する
# Redis はパスワード必須（requirepass）。REDIS_PASSWORD が .env に無いと compose がエラーにする
# REDIS_DB を読まないサービス（team-service, mypage-service）用
x-redis-base-env: &redis-base-env
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}

# REDIS_DB も読むサービス（auth-service と backend/shared/config を使うサービス）用
x-redis-env: &redis-env
  <<: *redis-base-env
  REDIS_DB: 0

# REDIS_URL は sfsp-api / sfsp-worker だけが読む（internal/config.ResolveRedisAddr）
x-redis-url-env: &redis-url-env
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379

# サービス間の内部 API（ヘッダー X-Internal-Key）
x-internal-api-env: &internal-api-env
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in .env}

# sfsp-api のクライアント（ヘッダー X-SFSP-API-Key）
x-sfsp-client-env: &sfsp-client-env
  SFSP_API_URL: http://sfsp-api:8080
  SFSP_API_KEY: ${SFSP_API_KEY:?SFSP_API_KEY must be set in .env}

# PostgreSQL の起動完了チェック。初期化中（init.sql 実行中）の一時サーバーは TCP を listen しないため、
# 127.0.0.1 に接続できた時点で init.sql の適用が終わっている
x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 30s

services:
  # ==========================================
  # Database Services (内部接続のみ)
  # DB も .env 全体を受け取らない（必要な変数だけを environment で渡す）
  # ==========================================
  auth-db:
    image: postgres:16
    container_name: atmosidea-auth-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./backend/auth/auth-datebase/auth-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *postgres-healthcheck
    networks:
      - backend-db-network

  app-db:
    image: postgres:16
    container_name: atmosidea-app-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: app_db
    volumes:
      - app_db_data:/var/lib/postgresql/data
      - ./backend/datebase/app-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *postgres-healthcheck
    networks:
      - backend-db-network

  profile-db:
    image: postgres:16
    container_name: atmosidea-profile-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: profile_db
    volumes:
      - profile_db_data:/var/lib/postgresql/data
      - ./backend/profile-service/profile-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *postgres-healthcheck
    networks:
      - backend-db-network

  team-db:
    image: postgres:16
    container_name: atmosidea-team-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: team_db
    volumes:
      - team_db_data:/var/lib/postgresql/data
      - ./backend/team-service/team-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *postgres-healthcheck
    networks:
      - backend-db-network

  # sfsp-db は sfsp-api / sfsp-worker だけが参加する sfsp-db-network に置く
  sfsp-db:
    image: postgres:16
    container_name: sfsp-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: sfsp_db
    volumes:
      - sfsp_db_data:/var/lib/postgresql/data
      - ./backend/security/sfsp-db:/docker-entrypoint-initdb.d
    healthcheck: *postgres-healthcheck
    networks:
      - sfsp-db-network

  # ==========================================
  # DB ロールのパスワード同期（起動のたびに実行して終了する）
  # init.sql はロールをパスワード無しで作成し、ここで .env の値を設定する。
  # 既存のボリュームにも適用されるため、.env を変えて up するだけでパスワードを変更できる
  # ==========================================
  db-role-init:
    image: postgres:16
    container_name: atmosidea-db-role-init
    restart: "no"
    entrypoint: ["sh", "/db-init/sync-role-passwords.sh"]
    environment:
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      AUTH_SERVICE_DB_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD:?AUTH_SERVICE_DB_PASSWORD must be set in .env}
      TEAM_SERVICE_DB_PASSWORD: ${TEAM_SERVICE_DB_PASSWORD:?TEAM_SERVICE_DB_PASSWORD must be set in .env}
      SFSP_WORKER_DB_PASSWORD: ${SFSP_WORKER_DB_PASSWORD:?SFSP_WORKER_DB_PASSWORD must be set in .env}
    volumes:
      - ./backend/db-init/sync-role-passwords.sh:/db-init/sync-role-passwords.sh:ro
    depends_on:
      auth-db:
        condition: service_healthy
      app-db:
        condition: service_healthy
      team-db:
        condition: service_healthy
    networks:
      - backend-db-network

  # ==========================================
  # Cache Service (内部接続のみ。パスワード必須)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: atmosidea-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    # パスワードを compose の command に展開しないよう、コンテナ内の環境変数から渡す。
    # 公式イメージの docker-entrypoint.sh を通して redis ユーザーに権限を落として起動する
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atmosidea-network
      - sfsp-isolated-net

  # ==========================================
  # Storage Service (Unified MinIO, bucket-level separation)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: atmosidea-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./backend/storage_data:/data
    networks:
      - atmosidea-network
      - sfsp-isolated-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # MinIO バケット自動初期化サービス
  # ==========================================
  minio-init:
    image: minio/mc:latest
    container_name: atmosidea-minio-init
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SFSP_API_ACCESS_KEY: ${SFSP_API_ACCESS_KEY}
      SFSP_API_SECRET_KEY: ${SFSP_API_SECRET_KEY}
      SFSP_GAME_WORKER_ACCESS_KEY: ${SFSP_GAME_WORKER_ACCESS_KEY}
      SFSP_GAME_WORKER_SECRET_KEY: ${SFSP_GAME_WORKER_SECRET_KEY}
      SFSP_STATIC_SITE_WORKER_ACCESS_KEY: ${SFSP_STATIC_SITE_WORKER_ACCESS_KEY}
      SFSP_STATIC_SITE_WORKER_SECRET_KEY: ${SFSP_STATIC_SITE_WORKER_SECRET_KEY}
      SFSP_PROFILE_WORKER_ACCESS_KEY: ${SFSP_PROFILE_WORKER_ACCESS_KEY}
      SFSP_PROFILE_WORKER_SECRET_KEY: ${SFSP_PROFILE_WORKER_SECRET_KEY}
      SFSP_VIDEO_WORKER_ACCESS_KEY: ${SFSP_VIDEO_WORKER_ACCESS_KEY}
      SFSP_VIDEO_WORKER_SECRET_KEY: ${SFSP_VIDEO_WORKER_SECRET_KEY}
      SFSP_WORKER_RAW_ACCESS_KEY: ${SFSP_WORKER_RAW_ACCESS_KEY}
      SFSP_WORKER_RAW_SECRET_KEY: ${SFSP_WORKER_RAW_SECRET_KEY}
      SFSP_WORKER_CLEAN_ACCESS_KEY: ${SFSP_WORKER_CLEAN_ACCESS_KEY}
      SFSP_WORKER_CLEAN_SECRET_KEY: ${SFSP_WORKER_CLEAN_SECRET_KEY}
      GAME_MINIO_ACCESS_KEY_ID: ${GAME_MINIO_ACCESS_KEY_ID}
      GAME_MINIO_SECRET_ACCESS_KEY: ${GAME_MINIO_SECRET_ACCESS_KEY}
      PROFILE_MINIO_ACCESS_KEY_ID: ${PROFILE_MINIO_ACCESS_KEY_ID}
      PROFILE_MINIO_SECRET_ACCESS_KEY: ${PROFILE_MINIO_SECRET_ACCESS_KEY}
      STATIC_SITE_MINIO_ACCESS_KEY_ID: ${STATIC_SITE_MINIO_ACCESS_KEY_ID}
      STATIC_SITE_MINIO_SECRET_ACCESS_KEY: ${STATIC_SITE_MINIO_SECRET_ACCESS_KEY}
      VIDEO_MINIO_ACCESS_KEY_ID: ${VIDEO_MINIO_ACCESS_KEY_ID}
      VIDEO_MINIO_SECRET_ACCESS_KEY: ${VIDEO_MINIO_SECRET_ACCESS_KEY}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until mc alias set myminio http://minio:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\"; do sleep 1; done;
      mc admin info myminio;

      set -e;

      echo 'Creating buckets...';
      mc mb --ignore-existing myminio/user-profiles;
      mc anonymous set download myminio/user-profiles;
      mc mb --ignore-existing myminio/static-sites;
      mc anonymous set download myminio/static-sites;
      mc mb --ignore-existing myminio/videos;
      mc anonymous set download myminio/videos;
      mc mb --ignore-existing myminio/games;
      mc anonymous set download myminio/games;
      mc mb --ignore-existing myminio/raw-files;
      mc mb --ignore-existing myminio/clean-files;
      mc mb --ignore-existing myminio/quarantine;

      echo 'Creating and updating policies...';
      mc admin policy create myminio sfsp-api-policy /tmp/sfsp-api-policy.json;
      mc admin policy create myminio sfsp-game-worker-policy /tmp/sfsp-game-worker-policy.json;
      mc admin policy create myminio sfsp-static-site-worker-policy /tmp/sfsp-static-site-worker-policy.json;
      mc admin policy create myminio sfsp-profile-worker-policy /tmp/sfsp-profile-worker-policy.json;
      mc admin policy create myminio sfsp-video-worker-policy /tmp/sfsp-video-worker-policy.json;
      mc admin policy create myminio sfsp-worker-raw-policy /tmp/sfsp-worker-raw-policy.json;
      mc admin policy create myminio sfsp-worker-clean-policy /tmp/sfsp-worker-clean-policy.json;
      mc admin policy create myminio app-game-policy /tmp/app-game-policy.json;
      mc admin policy create myminio app-profile-policy /tmp/app-profile-policy.json;
      mc admin policy create myminio app-static-site-policy /tmp/app-static-site-policy.json;
      mc admin policy create myminio app-video-policy /tmp/app-video-policy.json;

      echo 'Creating users and attaching policies...';
      mc admin user add myminio \"$SFSP_API_ACCESS_KEY\" \"$SFSP_API_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-api-policy --user=\"$SFSP_API_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_GAME_WORKER_ACCESS_KEY\" \"$SFSP_GAME_WORKER_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-game-worker-policy --user=\"$SFSP_GAME_WORKER_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_STATIC_SITE_WORKER_ACCESS_KEY\" \"$SFSP_STATIC_SITE_WORKER_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-static-site-worker-policy --user=\"$SFSP_STATIC_SITE_WORKER_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_PROFILE_WORKER_ACCESS_KEY\" \"$SFSP_PROFILE_WORKER_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-profile-worker-policy --user=\"$SFSP_PROFILE_WORKER_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_VIDEO_WORKER_ACCESS_KEY\" \"$SFSP_VIDEO_WORKER_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-video-worker-policy --user=\"$SFSP_VIDEO_WORKER_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_WORKER_RAW_ACCESS_KEY\" \"$SFSP_WORKER_RAW_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-worker-raw-policy --user=\"$SFSP_WORKER_RAW_ACCESS_KEY\" || true;

      mc admin user add myminio \"$SFSP_WORKER_CLEAN_ACCESS_KEY\" \"$SFSP_WORKER_CLEAN_SECRET_KEY\" || true;
      mc admin policy attach myminio sfsp-worker-clean-policy --user=\"$SFSP_WORKER_CLEAN_ACCESS_KEY\" || true;

      # アプリ側サービス用（各サービスは自分のバケットのみ操作可能）
      mc admin user add myminio \"$GAME_MINIO_ACCESS_KEY_ID\" \"$GAME_MINIO_SECRET_ACCESS_KEY\" || true;
      mc admin policy attach myminio app-game-policy --user=\"$GAME_MINIO_ACCESS_KEY_ID\" || true;

      mc admin user add myminio \"$PROFILE_MINIO_ACCESS_KEY_ID\" \"$PROFILE_MINIO_SECRET_ACCESS_KEY\" || true;
      mc admin policy attach myminio app-profile-policy --user=\"$PROFILE_MINIO_ACCESS_KEY_ID\" || true;

      mc admin user add myminio \"$STATIC_SITE_MINIO_ACCESS_KEY_ID\" \"$STATIC_SITE_MINIO_SECRET_ACCESS_KEY\" || true;
      mc admin policy attach myminio app-static-site-policy --user=\"$STATIC_SITE_MINIO_ACCESS_KEY_ID\" || true;

      mc admin user add myminio \"$VIDEO_MINIO_ACCESS_KEY_ID\" \"$VIDEO_MINIO_SECRET_ACCESS_KEY\" || true;
      mc admin policy attach myminio app-video-policy --user=\"$VIDEO_MINIO_ACCESS_KEY_ID\" || true;

      echo 'All MinIO buckets and SFSP policies/users initialized successfully!';
      "
    volumes:
      - ./backend/minio-init/sfsp-api-policy.json:/tmp/sfsp-api-policy.json:ro
      - ./backend/minio-init/sfsp-game-worker-policy.json:/tmp/sfsp-game-worker-policy.json:ro
      - ./backend/minio-init/sfsp-static-site-worker-policy.json:/tmp/sfsp-static-site-worker-policy.json:ro
      - ./backend/minio-init/sfsp-profile-worker-policy.json:/tmp/sfsp-profile-worker-policy.json:ro
      - ./backend/minio-init/sfsp-video-worker-policy.json:/tmp/sfsp-video-worker-policy.json:ro
      - ./backend/minio-init/sfsp-worker-raw-policy.json:/tmp/sfsp-worker-raw-policy.json:ro
      - ./backend/minio-init/sfsp-worker-clean-policy.json:/tmp/sfsp-worker-clean-policy.json:ro
      - ./backend/minio-init/app-game-policy.json:/tmp/app-game-policy.json:ro
      - ./backend/minio-init/app-profile-policy.json:/tmp/app-profile-policy.json:ro
      - ./backend/minio-init/app-static-site-policy.json:/tmp/app-static-site-policy.json:ro
      - ./backend/minio-init/app-video-policy.json:/tmp/app-video-policy.json:ro
    networks:
      - atmosidea-network
      - sfsp-isolated-net

  # ==========================================
  # Application Services & Microservices
  # ==========================================
  frontend:
    build:
      context: ./frontend
      args:
        CACHE_BUSTER: ${CACHE_BUSTER}
        VITE_STATIC_SITE_DOMAIN: ${STATIC_SITE_DOMAIN}
    container_name: atmosidea-frontend
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_started
      video-upload-api:
        condition: service_started
      video-worker:
        condition: service_started
      game-upload-api:
        condition: service_started
      mypage-service:
        condition: service_started
      profile-service:
        condition: service_started
      static-site-upload-api:
        condition: service_started
      # nginx.conf の upstream（team_service / *_storage）。起動時にホスト名を解決するので、コンテナが無いと host not found in upstream で落ちる
      team-service:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - atmosidea-network

  auth-service:
    build:
      context: .
      dockerfile: backend/auth/auth-worker/Dockerfile
    container_name: atmosidea-auth-service
    restart: always
    depends_on:
      auth-db:
        condition: service_started
      app-db:
        condition: service_started
      redis:
        condition: service_started
      profile-service:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      db-role-init:
        condition: service_completed_successfully
    environment:
      PROFILE_SERVICE_URL: "http://profile-service:8084"
      DATABASE_URL: "postgres://auth_service_user:${AUTH_SERVICE_DB_PASSWORD}@auth-db:5432/auth_db?sslmode=disable"
      APP_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_URL: ${APP_URL}
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE}
      MINIO_ENDPOINT: minio:9000
      PROFILE_MINIO_ACCESS_KEY_ID: ${PROFILE_MINIO_ACCESS_KEY_ID}
      PROFILE_MINIO_SECRET_ACCESS_KEY: ${PROFILE_MINIO_SECRET_ACCESS_KEY}
      GAME_MINIO_ENDPOINT: minio:9000
      GAME_MINIO_ACCESS_KEY_ID: ${GAME_MINIO_ACCESS_KEY_ID}
      GAME_MINIO_SECRET_ACCESS_KEY: ${GAME_MINIO_SECRET_ACCESS_KEY}
      STATIC_SITE_MINIO_ENDPOINT: minio:9000
      STATIC_SITE_MINIO_ACCESS_KEY_ID: ${STATIC_SITE_MINIO_ACCESS_KEY_ID}
      STATIC_SITE_MINIO_SECRET_ACCESS_KEY: ${STATIC_SITE_MINIO_SECRET_ACCESS_KEY}
      # VIDEO_MINIO_ENDPOINT は未指定なら MINIO_ENDPOINT を使う
      VIDEO_MINIO_ACCESS_KEY_ID: ${VIDEO_MINIO_ACCESS_KEY_ID}
      VIDEO_MINIO_SECRET_ACCESS_KEY: ${VIDEO_MINIO_SECRET_ACCESS_KEY}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      <<: [*redis-env, *internal-api-env]
      TEAM_SERVICE_URL: http://team-service:8080
    networks:
      - atmosidea-network
      - backend-db-network

  profile-service:
    build:
      context: .
      dockerfile: backend/profile-service/profile-worker/Dockerfile
    container_name: atmosidea-profile-service
    restart: always
    depends_on:
      profile-db:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      sfsp-api:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@profile-db:5432/profile_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_ID: ${PROFILE_MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${PROFILE_MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET_NAME: user-profiles
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      SFSP_CLEAN_MINIO_ENDPOINT: minio:9000
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_PROFILE_WORKER_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_PROFILE_WORKER_SECRET_KEY}
      SFSP_CLEAN_MINIO_USE_SSL: "false"
      <<: [*redis-env, *internal-api-env, *sfsp-client-env]
      MAX_IMAGE_UPLOAD_BYTES: ${MAX_IMAGE_UPLOAD_BYTES:-10485760}
    networks:
      - atmosidea-network
      - backend-db-network
      - sfsp-isolated-net # sfsp-api への到達用（sfsp-api は atmosidea-network に居ない）

  team-service:
    build:
      context: .
      dockerfile: backend/team-service/team-worker/Dockerfile
    container_name: atmosidea-team-service
    restart: always
    depends_on:
      team-db:
        condition: service_started
      redis:
        condition: service_started
      db-role-init:
        condition: service_completed_successfully
    environment:
      TEAM_DATABASE_URL: "postgres://team_service_user:${TEAM_SERVICE_DB_PASSWORD}@team-db:5432/team_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      <<: [*redis-base-env, *internal-api-env]
    networks:
      - atmosidea-network
      - backend-db-network

  video-upload-api:
    build:
      context: .
      dockerfile: backend/video-service/video-upload-api/Dockerfile
    container_name: atmosidea-video-upload-api
    restart: always
    depends_on:
      app-db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      sfsp-api:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/app_db?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /storage/videos
      VIDEO_MINIO_ENDPOINT: minio:9000
      VIDEO_MINIO_ACCESS_KEY_ID: ${VIDEO_MINIO_ACCESS_KEY_ID}
      VIDEO_MINIO_SECRET_ACCESS_KEY: ${VIDEO_MINIO_SECRET_ACCESS_KEY}
      SFSP_CLEAN_MINIO_ENDPOINT: minio:9000
      SFSP_CLEAN_MINIO_ACCESS_KEY_ID: ${SFSP_WORKER_CLEAN_ACCESS_KEY}
      SFSP_CLEAN_MINIO_SECRET_ACCESS_KEY: ${SFSP_WORKER_CLEAN_SECRET_KEY}
      SFSP_CLEAN_MINIO_USE_SSL: "false"
      <<: [*redis-env, *sfsp-client-env]
      TEAM_SERVICE_URL: http://team-service:8080
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-1073741824}
    volumes:
      - ./backend/video-service/upload_workdir:/storage
    networks:
      - atmosidea-network
      - backend-db-network
